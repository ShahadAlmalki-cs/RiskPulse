# RiskPulse dashboard theme — light financial-SaaS look
# Lavender canvas, white rounded cards, navy typography, blue accents.

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "14px"
buttonRadius = "10px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["26px", "21px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 500, 500]
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#3569D4"
backgroundColor = "#F1F2FC"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#EEF0FA"
textColor = "#0B1528"
linkColor = "#3569D4"
borderColor = "#E3E6F5"
codeTextColor = "#3A4763"
greenColor = "#1E9E6A"
redColor = "#E15241"
yellowColor = "#D9930D"
orangeColor = "#E1760B"
blueColor = "#3569D4"
violetColor = "#7A5AF8"
grayColor = "#77839A"
chartCategoricalColors = [
    "#3569D4",
    "#7FB0F5",
    "#0B1528",
    "#F6866E",
    "#1E9E6A",
    "#D9930D",
    "#7A5AF8",
    "#77839A",
]
chartSequentialColors = [
    "#EEF2FE",
    "#D6E2FB",
    "#B9CDF7",
    "#93B4F1",
    "#6D97E9",
    "#4D7CDD",
    "#3569D4",
    "#2854B4",
    "#1D3F8C",
    "#152D6B",
]
dataframeBorderColor = "#E3E6F5"
dataframeHeaderBackgroundColor = "#F6F7FE"
dataframeHeaderTextColor = "#0B1528"

[theme.dark]
