# RiskPulse brand theme â€” derived from riskpulse-logo-horizontal-reversed.svg
#
# Palette (taken straight from the logo):
#   ink      #0B1528  deep navy background the logo is drawn for
#   white    #FFFFFF  "Risk" and the R monogram
#   pulse    #7FA3EE  "Pulse" and the ECG stroke   (primary)
#   coral    #F6866E  the pulse end-point dot
# Surfaces are navy tints of the logo ink, so the whole UI reads as one
# material. Colour is used for meaning only: coral/red is reserved for declines
# and errors, green for approvals, amber for manual review.

[theme]
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "12px"
buttonRadius = "10px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "12.5px"
headingFontSizes = ["24px", "19px", "16px", "15px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
linkUnderline = false
paddingTop = "1.25rem"
paddingBottom = "2rem"

[theme.light]
primaryColor = "#3E6FD6"
backgroundColor = "#F2F5FD"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#EEF2FC"
textColor = "#0B1528"
linkColor = "#2F5FC4"
borderColor = "#DDE4F4"
codeTextColor = "#3A4763"
greenColor = "#0F7A50"
redColor = "#C2412F"
yellowColor = "#9A6A00"
orangeColor = "#B4591B"
blueColor = "#2F5FC4"
violetColor = "#4B5BD6"
grayColor = "#5F6B85"
chartCategoricalColors = ["#3E6FD6", "#7FA3EE", "#0B1528", "#F6866E", "#0F7A50", "#9A6A00"]
chartSequentialColors = [
    "#F2F5FD",
    "#E3EBFB",
    "#CBDDF8",
    "#A9C6F3",
    "#7FA3EE",
    "#5A87E4",
    "#3E6FD6",
    "#2F5FC4",
    "#24489A",
    "#0B1528",
]
dataframeBorderColor = "#DDE4F4"
dataframeHeaderBackgroundColor = "#F6F8FE"
dataframeHeaderTextColor = "#0B1528"

# Dark mode, tuned for long sessions: four near-black slate steps give the
# page, cards and inputs depth without any bright surface, and secondary text
# is lifted to #A8B4C9 so labels and captions stay legible on the cards.
# Logo accent colours (primary, green/amber/coral status) are unchanged.
[theme.dark]
primaryColor = "#8FB0F0"
backgroundColor = "#111A2B"
secondaryBackgroundColor = "#18233A"
codeBackgroundColor = "#141F35"
textColor = "#E4EAF5"
linkColor = "#9DBBF2"
borderColor = "#2A3A58"
codeTextColor = "#C4D0E4"
greenColor = "#5BD0A2"
redColor = "#F6866E"
yellowColor = "#E8B75A"
orangeColor = "#F2A16B"
blueColor = "#8FB0F0"
violetColor = "#9FA9F5"
grayColor = "#A8B4C9"
grayBackgroundColor = "#1F2C46"
greenBackgroundColor = "#142E2C"
redBackgroundColor = "#34202B"
yellowBackgroundColor = "#312A1C"
orangeBackgroundColor = "#332619"
blueBackgroundColor = "#1B2A47"
violetBackgroundColor = "#24263F"
greenTextColor = "#5BD0A2"
redTextColor = "#F6866E"
yellowTextColor = "#E8B75A"
orangeTextColor = "#F2A16B"
blueTextColor = "#8FB0F0"
violetTextColor = "#9FA9F5"
grayTextColor = "#A8B4C9"
chartCategoricalColors = ["#8FB0F0", "#7FA3EE", "#E8EDF7", "#F6866E", "#5BD0A2", "#E8B75A"]
chartSequentialColors = [
    "#111A2B",
    "#18233A",
    "#1F2C46",
    "#27395C",
    "#31548A",
    "#416EA9",
    "#5A87E4",
    "#7FA3EE",
    "#A9C6F3",
    "#E3EBFB",
]
dataframeBorderColor = "#2A3A58"
dataframeHeaderBackgroundColor = "#1B2740"
dataframeHeaderTextColor = "#E4EAF5"

[theme.sidebar]
paddingTop = "1rem"
paddingBottom = "1.5rem"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5FD"
codeBackgroundColor = "#EEF2FC"
textColor = "#0B1528"
borderColor = "#DDE4F4"
primaryColor = "#3E6FD6"
linkColor = "#2F5FC4"

[theme.dark.sidebar]
backgroundColor = "#131D30"
secondaryBackgroundColor = "#18233A"
codeBackgroundColor = "#141F35"
textColor = "#E4EAF5"
borderColor = "#2A3A58"
primaryColor = "#8FB0F0"
linkColor = "#9DBBF2"
grayTextColor = "#A8B4C9"



