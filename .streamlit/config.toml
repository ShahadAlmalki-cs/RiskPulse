# RiskPulse brand theme â€” derived from riskpulse-logo-horizontal-reversed.svg
#
# Palette (taken straight from the logo):
#   ink      #0B1528  deep navy background the logo is drawn for
#   white    #FFFFFF  "Risk" and the R monogram
#   pulse    #7FA3EE  "Pulse" and the ECG stroke   (primary)
#   coral    #F6866E  the pulse end-point dot
# Surfaces are navy tints of the logo ink, so the whole UI reads as one
# material. Colour is used for meaning only: coral/red is reserved for declines
# and errors, green for approvals, amber for manual review.

[theme]
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "12px"
buttonRadius = "10px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "12.5px"
headingFontSizes = ["24px", "19px", "16px", "15px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
linkUnderline = false
paddingTop = "1.25rem"
paddingBottom = "2rem"

[theme.light]
primaryColor = "#3E6FD6"
backgroundColor = "#F2F5FD"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#EEF2FC"
textColor = "#0B1528"
linkColor = "#2F5FC4"
borderColor = "#DDE4F4"
codeTextColor = "#3A4763"
greenColor = "#0F7A50"
redColor = "#C2412F"
yellowColor = "#9A6A00"
orangeColor = "#B4591B"
blueColor = "#2F5FC4"
violetColor = "#4B5BD6"
grayColor = "#5F6B85"
chartCategoricalColors = ["#3E6FD6", "#7FA3EE", "#0B1528", "#F6866E", "#0F7A50", "#9A6A00"]
chartSequentialColors = [
    "#F2F5FD",
    "#E3EBFB",
    "#CBDDF8",
    "#A9C6F3",
    "#7FA3EE",
    "#5A87E4",
    "#3E6FD6",
    "#2F5FC4",
    "#24489A",
    "#0B1528",
]
dataframeBorderColor = "#DDE4F4"
dataframeHeaderBackgroundColor = "#F6F8FE"
dataframeHeaderTextColor = "#0B1528"

[theme.dark]
primaryColor = "#8FB0F0"
backgroundColor = "#0B1528"
secondaryBackgroundColor = "#101D33"
codeBackgroundColor = "#13223B"
textColor = "#E8EDF7"
linkColor = "#8FB0F0"
borderColor = "#1E2C47"
codeTextColor = "#C4D0E4"
greenColor = "#5BD0A2"
redColor = "#F6866E"
yellowColor = "#E8B75A"
orangeColor = "#F2A16B"
blueColor = "#8FB0F0"
violetColor = "#9FA9F5"
grayColor = "#93A1BA"
chartCategoricalColors = ["#8FB0F0", "#7FA3EE", "#E8EDF7", "#F6866E", "#5BD0A2", "#E8B75A"]
chartSequentialColors = [
    "#0B1528",
    "#13223B",
    "#1B2F50",
    "#24406B",
    "#31548A",
    "#416EA9",
    "#5A87E4",
    "#7FA3EE",
    "#A9C6F3",
    "#E3EBFB",
]
dataframeBorderColor = "#1E2C47"
dataframeHeaderBackgroundColor = "#0F1B2F"
dataframeHeaderTextColor = "#E8EDF7"

[theme.sidebar]
paddingTop = "1rem"
paddingBottom = "1.5rem"

